# pubspec.yaml
name: habit_buddy
description: Habit Buddy - a beautiful, offline-first habit tracker for Android.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  file_picker: ^10.2.0
  fl_chart: 1.0.0
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^4.1.0
  sqflite_common_ffi_web: ^1.0.1+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Put the provided logo at assets/images/habit_buddy_logo.png (used as-is).
    # The app still builds and launches without it (neutral fallback is shown).
    - assets/images/